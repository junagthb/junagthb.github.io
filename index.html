<!DOCTYPE html>
<html>
<head>
    <title>My17App</title><script src="https://sdk.minepi.com/pi-sdk.js"></script>
<script>
  Pi.init({ version: "2.0", sandbox: false });
</script>
</head>
<body>
    <h1>My17App</h1><button id="login">Login dengan Pi</button>
    <p id="status"></p>
<button id="pay">Bayar dengan Pi</button>
    <script>
document.getElementById("login").onclick = function () {
    Pi.authenticate(
        ["username"],
        function (payment) {
            console.log("Incomplete payment:", payment);
        }
    )
    .then(function (auth) {
        document.getElementById("status").innerText =
            "Login Pi berhasil: " + auth.user.username;
    })
    .catch(function (error) {
        document.getElementById("status").innerText =
            "Login gagal: " + error;
    });
};
    });
  };
</script>
    <p>Aplikasi saya sudah aktif.</p>
</body>
</html>
